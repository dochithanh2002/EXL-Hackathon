[project]
name = "controlplane"
version = "0.1.0"
description = "Control plane for the R to Python model transformation platform"
requires-python = "==3.12.*"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.7",
    "mlflow-skinny==3.18.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
