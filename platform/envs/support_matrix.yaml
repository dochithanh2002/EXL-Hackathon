# R -> statsmodels support matrix. Checked by code at the step 2 gate; anything not listed is unsupported.
# `tier` is the parity a pair is expected to reach. A pair is proven only once `fixture` names a directory under
# platform/backend/tests/fixtures/parity/ that the parity tests pass; until then the DS must accept the parity risk
# at confirmation, and the UI shows it as unproven, even for an exact pair.
version: 1
pairs:
  - r: stats::lm
    statsmodels: [statsmodels.api.OLS, statsmodels.api.WLS]
    tier: exact
    fixture: null
  - r: stats::glm
    families: [gaussian, binomial, poisson, Gamma, inverse.gaussian, quasi, quasibinomial, quasipoisson]
    statsmodels: [statsmodels.api.GLM]
    tier: exact
    fixture: null
  - r: MASS::glm.nb
    statsmodels: [statsmodels.api.NegativeBinomial, statsmodels.api.GLM]
    tier: exact
    fixture: null
  - r: nnet::multinom
    statsmodels: [statsmodels.api.MNLogit]
    tier: exact
    fixture: null
  - r: MASS::polr
    statsmodels: [statsmodels.miscmodels.ordinal_model.OrderedModel]
    tier: exact
    fixture: null
  - r: quantreg::rq
    statsmodels: [statsmodels.api.QuantReg]
    tier: exact
    fixture: null
  - r: nlme::gls
    statsmodels: [statsmodels.api.GLS, statsmodels.api.GLSAR]
    tier: exact
    fixture: null
  - r: glmnet::glmnet
    statsmodels: [statsmodels.api.GLM.fit_regularized, statsmodels.api.OLS.fit_regularized]
    tier: approximate
  - r: glmnet::cv.glmnet
    statsmodels: [statsmodels.api.GLM.fit_regularized, statsmodels.api.OLS.fit_regularized]
    tier: approximate
  - r: mgcv::gam
    statsmodels: [statsmodels.gam.api.GLMGam]
    tier: approximate
  - r: lme4::lmer
    statsmodels: [statsmodels.api.MixedLM]
    tier: approximate
  - r: lme4::glmer
    statsmodels: [statsmodels.genmod.bayes_mixed_glm.BinomialBayesMixedGLM, statsmodels.genmod.bayes_mixed_glm.PoissonBayesMixedGLM]
    tier: approximate
  - r: nlme::lme
    statsmodels: [statsmodels.api.MixedLM]
    tier: approximate
  - r: MASS::rlm
    statsmodels: [statsmodels.api.RLM]
    tier: approximate
  - r: survival::coxph
    statsmodels: [statsmodels.api.PHReg]
    tier: approximate
  - r: stats::arima
    statsmodels: [statsmodels.tsa.arima.model.ARIMA, statsmodels.tsa.statespace.sarimax.SARIMAX]
    tier: approximate
  - r: forecast::Arima
    statsmodels: [statsmodels.tsa.arima.model.ARIMA, statsmodels.tsa.statespace.sarimax.SARIMAX]
    tier: approximate
  - r: forecast::auto.arima
    statsmodels: [statsmodels.tsa.arima.model.ARIMA, statsmodels.tsa.statespace.sarimax.SARIMAX]
    tier: approximate
