# Load after compose.yaml to serve the application over HTTPS.
services:
  controlplane:
    environment:
      CONTROLPLANE_MLFLOW_PUBLIC_URL: /mlflow

  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,127.0.0.1:5000,localhost:5000,${R2PY_DOMAIN:?Set the public DNS name}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: https://${R2PY_DOMAIN:?Set the public DNS name}

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      R2PY_DOMAIN: ${R2PY_DOMAIN:?Set the public DNS name}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${R2PY_AUTH_FILE:?Set the path to a Caddy users file}
        target: /etc/caddy/users.caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      controlplane: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
