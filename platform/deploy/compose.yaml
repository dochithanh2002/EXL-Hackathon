# Linux deployment: docker compose -f deploy/compose.yaml up --build   (from platform/)
# The UI is at http://127.0.0.1:8000 and MLflow at http://127.0.0.1:5000. The API has no authentication, so ports
# are published on the loopback interface only; put an authenticating reverse proxy in front to share it.
name: r2py

x-image: &image
  image: r2py:local
  build: { context: .., dockerfile: deploy/Dockerfile }
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  controlplane:
    <<: *image
    working_dir: /opt/platform/backend
    command: [sh, -c, "umask 077 && exec .venv/bin/python -m controlplane"]
    environment:
      CONTROLPLANE_HOST: 0.0.0.0
      CONTROLPLANE_PORT: "8000"
      CONTROLPLANE_URL: http://controlplane:8000          # where agent tool calls come back to
      CONTROLPLANE_DATA_DIR: /data
      CONTROLPLANE_AGENTS_URL: http://agents:8100
      CONTROLPLANE_MLFLOW_URI: http://mlflow:5000
      CONTROLPLANE_MLFLOW_PUBLIC_URL: http://127.0.0.1:5000
      CONTROLPLANE_STEP_USER: step
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
    volumes: [data:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      agents: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      start_period: 20s

  agents:
    <<: *image
    user: agents
    working_dir: /opt/platform/agents
    command: [node, server.ts]
    environment:                                         # no host environment: keys arrive only inside run requests
      HOME: /tmp
      AGENTS_HOST: 0.0.0.0
      AGENTS_PORT: "8100"
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8100/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s

  mlflow:
    <<: *image
    user: mlflow
    working_dir: /mlflow
    command: [/opt/platform/envs/mlflow/.venv/bin/mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1",
              --backend-store-uri, sqlite:////mlflow/mlflow.db, --artifacts-destination, /mlflow/artifacts,
              --allowed-hosts, "mlflow:5000,127.0.0.1:5000,localhost:5000"]
    cap_drop: [ALL]
    volumes: [mlflow:/mlflow]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: [CMD, /opt/platform/envs/mlflow/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      start_period: 30s

volumes:
  data:
  mlflow:
